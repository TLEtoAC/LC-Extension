# File: application.properties
# Author: REST API Agent
# Phase: Phase 1 — Backend Skeleton
# Purpose: Spring Boot application configuration properties for the LeetCode Contest Monitor backend.

# Port for local HTTP server communication with Chrome Extension
server.port=8080

# Bind exclusively to localhost (127.0.0.1) loopback interface.
# CRITICAL SECURITY CONSTRAINT: Never bind to 0.0.0.0 or LAN interfaces.
# Binding to 127.0.0.1 ensures the backend is only accessible by local processes and the local Chrome browser,
# preventing unauthorized external or local network access.
server.address=127.0.0.1
